server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

gemini.api.key=${GEMINI_API_KEY}

facebook.app.id=${FACEBOOK_APP_ID}
facebook.app.secret=${FACEBOOK_APP_SECRET}
facebook.graph-version=${FACEBOOK_GRAPH_VERSION}
facebook.redirect.uri=${FACEBOOK_REDIRECT_URL}
facebook.webhook.verify-token=${FACEBOOK_WEBHOOK_VERIFY-TOKEN}
