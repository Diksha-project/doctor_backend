spring.application.name=DoctorClinic
server.port=8080

spring.datasource.url=jdbc:h2:mem:doctorclinic;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false
spring.main.allow-bean-definition-overriding=true

jwt.secret=abcdefghijklmnopqrstuvwxyz1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=3600000

gemini.api.key=test-key
facebook.app.id=test-app-id
facebook.app.secret=test-app-secret
facebook.redirect.uri=http://localhost
facebook.graph-version=v22.0
facebook.webhook.verify-token=test-verify-token
